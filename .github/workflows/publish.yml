name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish-hydb:
    if: startsWith(github.event.release.tag_name, 'hydb-v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run build && npm test

      - name: Publish @438d/hydb
        run: npm publish
        working-directory: packages/hydb
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-hyapp:
    if: startsWith(github.event.release.tag_name, 'hyapp-v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run build && npm test

      - name: Publish @438d/hyapp
        run: npm publish
        working-directory: packages/hyapp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
